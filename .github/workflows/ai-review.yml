name: AI Review (pré-review)

# Review automático: todo PR aberto ou atualizado roda o mesmo /review da
# rodada 2, com o contexto do time (CLAUDE.md, skills e a issue ligada ao PR).
# Precisa do segredo CLAUDE_CODE_OAUTH_TOKEN (claude setup-token).
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Liga o contexto do time, igual à rodada 2
      - run: bash demo/add-context.sh

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /review ${{ github.event.pull_request.html_url }}

            Depois, publique no PR: cada bug como comentário inline (arquivo e linha)
            e a tabela como comentário. Você não aprova nem bloqueia: quem decide é o humano.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob,Skill"
