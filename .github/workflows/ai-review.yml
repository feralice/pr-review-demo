name: AI Review (pré-review)

# Na demo roda só manual (Actions > AI Review > Run workflow), porque precisa do
# segredo CLAUDE_CODE_OAUTH_TOKEN. Pra rodar sozinho em todo PR, troque por:
#   pull_request:
#     types: [opened, reopened, synchronize, ready_for_review]
# e use github.event.pull_request.number no lugar de inputs.pr_number.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número do PR
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ai-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Você é um revisor sênior de backend fazendo o pré-review deste PR.
            Leia a descrição do PR e o diff (gh pr view, gh pr diff).
            Se a descrição citar uma issue (ex.: Closes #1), leia com gh issue view e use como requisito.

            Procure bugs e code smells.
            Se existirem skills na pasta .claude/skills (negocio, bugs, legibilidade),
            aplique-as ao diff, uma por vez, como no comando /review, e junte tudo no resumo.

            Formato: comente cada achado inline, no arquivo e na linha. No fim,
            publique um resumo em tabela com arquivo, linha, tipo (bug ou smell),
            severidade e motivo.

            Anti-ruído: só aponte o que puder justificar. Na dúvida, diga que está
            em dúvida. Você não aprova nem bloqueia: quem decide é o humano.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob,Skill"
