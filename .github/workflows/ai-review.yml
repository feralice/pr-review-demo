name: AI Review (pré-review)

# Review automático: todo PR aberto ou atualizado roda o Claude Code com o
# contexto do time (CLAUDE.md, skills e a issue ligada ao PR).
# Precisa do segredo CLAUDE_CODE_OAUTH_TOKEN (claude setup-token).
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Liga o contexto do time, igual à rodada 2
      - run: bash demo/add-context.sh

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revise este PR com o contexto do time.
            - O PR: leia a descrição e o diff (gh pr view, gh pr diff).
            - A task: se a descrição citar uma issue (ex.: Closes #1), leia com gh issue view e use como requisito.
            - As regras do time: o CLAUDE.md.
            - O repositório: para cada função que o PR mudou, procure com Grep quem usa ela, inclusive fora do diff.

            Aplique, uma por vez, as skills negocio, bugs e legibilidade.
            Comente cada bug inline, no arquivo e na linha. No fim, publique um
            resumo curto em tabela: arquivo, problema e quem achou (skill ou regra do time).
            Você não aprova nem bloqueia: quem decide é o humano.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob,Skill"
