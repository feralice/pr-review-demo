name: CI

# Sem pull_request: o PR da demo fica sem check, e o bug aparece no npm test
# ao vivo, não no CI.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
